name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Get your code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run lint check (optional but good)
    - name: Lint code
      run: |
        pip install flake8
        flake8 . || true

    # 5. Run tests (if you add tests later)
    - name: Run tests
      run: |
        echo "No tests yet"
        # pytest

    # 6. Run your app (optional check)
    - name: Run app
      run: |
        echo "CI pipeline executed successfully!"
